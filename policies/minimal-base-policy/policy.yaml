---
# Minimal Base Policy
#
# Relies on EC's built-in signature and attestation checks (always
# evaluated regardless of policy sources). The empty sources list
# means no additional Rego rules are loaded — only the built-in
# checks run:
#   - builtin.attestation.signature_check
#   - builtin.attestation.syntax_check
#   - builtin.image.signature_check
#
# To add custom Rego rules, add a file::rules/ source.
# To add upstream conforma rules, add an oci:: source with a version
# compatible with the ec binary on the cluster.

sources: []
